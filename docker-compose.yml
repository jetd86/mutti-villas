services:
  php:
    build:
      context: ./php
    image: php8.4.8-fpm
    container_name: ${PROJECT_NAME}_php8.4.8-fpm
    restart: always
    expose:
      - "9000"  # Порт для PHP-FPM, теперь напрямую используется Nginx
    volumes:
      - ./app:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/php.ini
    networks:
      - ${DOCKER_NETWORK}
    env_file:
      - .env

  nginx:
    image: nginx:1.29.0-alpine-perl
    container_name: ${PROJECT_NAME}_nginx
    restart: always
    ports:
      - "${LOCALHOST_PORT}:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./app:/var/www/html
      - ./letsencrypt:/etc/nginx/ssl:ro
    depends_on:
      - php
    networks:
      - ${DOCKER_NETWORK}

  db:
    image: mysql:8.4.5
    container_name: ${PROJECT_NAME}_mysql8.4
    restart: always
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - ./bitrix_docker_db_backup.sql:/docker-entrypoint-initdb.d/bitrix_docker_db_backup.sql
      - ${VOLUME_DB_DATA}:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - ${DOCKER_NETWORK}
    env_file:
      - .env

  redis:
    image: redis:8.2-m01-alpine3.22
    container_name: ${PROJECT_NAME}_redis8.2
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ${VOLUME_REDIS_DATA}:/data
      - ./app:/var/www/html
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - ${DOCKER_NETWORK}
    
  node:
    image: node:24-slim
    container_name: bitrix_node24
    restart: always
    working_dir: /var/www/html/frontend
    volumes:
      - ./app:/var/www/html/
    ports:
      - "3000:3000"
    command: [ "sh", "-c", "npm install" ]
    networks:
      - ${DOCKER_NETWORK}
    env_file:
      - .env

networks:
  docker-network:
    external: true

volumes:
  db_bitrix:
  db_redis:
