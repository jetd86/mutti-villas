server {
    listen 443 ssl;
    server_name muttivillas.ru;
    root /var/www/html;
    index index.php index.html;

    # SSL настройки (ваши остаются)
    ssl_certificate     /etc/nginx/ssl/live/muttivillas.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/muttivillas.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Отключение автоиндекса (аналог Options -Indexes)
    autoindex off;

    # Кастомная страница 404
    error_page 404 /404.php;

    # Let's Encrypt challenge
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
        allow all;
    }

    # Статические файлы с кэшированием
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|pdf|zip|webp|mp4|mov|avi|json)$ {
        try_files $uri =404;
        expires 1y; 
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Обработка PHP файлов с передачей Authorization заголовка
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_AUTHORIZATION $http_authorization;  # Передача Authorization
        fastcgi_read_timeout 180;
    }

    # Основная логика ЧПУ Битрикс
    location / {
        try_files $uri $uri/ @bitrix;
    }

    # Обработчик ЧПУ для Битрикс
    location @bitrix {
        fastcgi_pass   php:9000;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
        fastcgi_param  REQUEST_URI $uri;
        fastcgi_param  HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 180;
    }

    # Запрет скрытых файлов
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Запрет доступа к служебным файлам Битрикс
    location ~* ^/(upload|bitrix)/(backup|modules|local/modules|stack_cache)/ {
        deny all;
    }
}
